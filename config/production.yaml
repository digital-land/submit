organisationTypes:
  - local-authority
  - national-park-authority
  - development-corporation
  - local-planning-group
asyncRequestApi: {
    url: https://pub-async.planning.data.gov.uk
}
aws: {
    region: eu-west-2,
    bucket: 'production-pub-async-request-files',
}
manageServiceUrl: 'https://manage.planning.data.gov.uk'
mainWebsiteUrl: 'https://www.planning.data.gov.uk'
redis: {
    secure: true,
    host: 'production-pub-async-redis-eihmmv.serverless.euw2.cache.amazonaws.com',
    port: 6379
}
url: 'https://provide.planning.data.gov.uk/'
jira: {
  requestTypeId: 28
}
features:
  submitEndpointForm:
    enabled: true
  checkIssueDetailsPage:
    # https://github.com/digital-land/submit/issues/786
    # enabling this feature will cause the results page to present
    # links to individual issue pages
    enabled: true
  expectationOutOfBoundsTask:
    enabled: false
  provisionBasedDatasets:
    # This feature will load datasets based on provisionReasons (as well as the hard coded list in default.yaml)
    enabled: false
  nonAuthPages:
    # This feature enables pages to show non-authoritative datasets
    # If off, it will still check for local-plan datasets.
    enabled: true
